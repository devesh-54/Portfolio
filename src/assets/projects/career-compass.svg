<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="55%" stop-color="#071124" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 240) scale(460 320)">
      <stop offset="0%" stop-color="#2fd0ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2fd0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 620) scale(420 260)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" stroke="#8fc4ff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)" />
