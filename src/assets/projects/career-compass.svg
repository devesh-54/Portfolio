  <text x="648" y="110" text-anchor="middle" fill="#9fe7ff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">GLOBAL AI HACKATHON 2026</text>

  <text x="640" y="196" text-anchor="middle" fill="#e8f1ff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" letter-spacing="-1">Career Compass Flow</text>
  <text x="640" y="236" text-anchor="middle" fill="#a8c7f0" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">AI career intelligence · ATS &amp; live salary radar</text>

