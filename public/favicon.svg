<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep obsidian space backdrop -->
    <linearGradient id="d-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon cyber border -->
    <linearGradient id="d-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Stylized D Core Gradient -->
    <linearGradient id="d-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#00f5ff"/>
      <stop offset="65%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="d-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#00f0ff" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glowing Border -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#d-bg)" stroke="url(#d-border)" stroke-width="2.5"/>

  <!-- High-Tech Stylized D with Chamfer & Cyber Cuts -->
  <g filter="url(#d-glow)">
    <!-- Main D Body: Outer loop and inner counter -->
    <path
      d="M17 15 H33 C42.5 15 48.5 21.8 48.5 32 C48.5 42.2 42.5 49 33 49 H17 Z M25.5 23 V41 H32 C37 41 40 37.5 40 32 C40 26.5 37 23 32 23 Z"
      fill="url(#d-core)"
    />
    <!-- Chamfer Accent on Top Left -->
    <polygon points="17,15 24,15 17,22" fill="#ffffff" opacity="0.95"/>
    <!-- Velocity Slice on Upper Wing -->
    <polygon points="41,18 45,22 43,23 39,19" fill="#00f5ff"/>
    <!-- Cyan Energy Beacon Node -->
    <circle cx="21" cy="45" r="1.5" fill="#00f5ff"/>
  </g>
</svg>
